name: Build Windows (Setup + Portable)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (NSIS installer)
        run: npx tauri build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage portable executable
        shell: bash
        run: cp "src-tauri/target/release/agent-usage.exe" "src-tauri/target/release/Agent-Usage_x64-portable.exe"

      - name: Upload Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-App-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-App-Portable
          path: src-tauri/target/release/*-portable.exe
          if-no-files-found: error
